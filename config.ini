; EyeLink Key Capture settings. Edit and restart the program; no rebuild needed.

[tracker]
; IP address of the EyeLink Host PC.
host_ip = 100.1.1.1
; true = run without a tracker (for testing the keys and screenshots).
dummy_mode = false
; HV9, HV13, HV5 or HV3.
calibration_type = HV9
; How far the calibration targets spread, as a percentage of the screen width
; (horizontal) and height (vertical), centred on the screen. Validation uses
; the same area. EyeLink defaults: 88 and 83. Smaller values keep the targets
; away from the screen edges.
calibration_area_horizontal = 88
calibration_area_vertical = 83

[display]
; Screen the participant looks at (eye-tracked screen). Gaze coordinates,
; calibration and screenshots all use this screen.
; auto = the first monitor whose resolution matches width x height below.
; A number picks a monitor by position: 1 = first, 2 = second, ...
monitor = auto
width = 4200
height = 2800
; Calibration screen colours as R,G,B. Keep the background close to the
; brightness of the DICOM viewer so pupil size is similar.
cal_background = 40,40,40
cal_foreground = 255,255,255

[keys]
; Key names: a single character (1, 2, a, ...) or a special key name
; (f1-f12, space, pause, scroll_lock, insert, ...).
; Participant presses this when they have found the finding: marks the EDF
; and takes a screenshot.
response_key = 1
; Starts the next case (new trial in Data Viewer).
case_key = 2
; Operator: end the current case and recalibrate.
recalibrate_key = f9
; Operator: stop and save. Press twice within 3 seconds.
quit_key = f10

[output]
; Session folders are created here. Relative paths are relative to the .exe.
folder = data
; PNG compression 0-9. 1 is fast and only slightly larger than 6.
png_compression = 1
